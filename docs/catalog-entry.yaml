# Template for NousResearch/hermes-agent → plugin-catalog/meeting-scribe.yaml
# Schema: plugin-catalog/README.md ("Entry schema"). This repo's CI validates this shape on every
# push with the pushed commit substituted for `sha`. The submitted catalog file pins the full
# 40-character release commit; bump `version` with every re-pin.
name: meeting-scribe
repo: https://github.com/propiter/hermes-meeting-scribe
sha: "0000000000000000000000000000000000000000"
title: Meeting Scribe
description: >-
  Records Discord voice meetings one track per speaker, transcribes them locally with
  faster-whisper and turns them into a summary, decisions, open questions and tasks routed
  per project. Disclosure — joins voice channels on /meeting and, by default, automatically
  when at least two humans gather (autojoin_enabled / autojoin_min_humans); announces every
  recording in the channel chat and prefixes the bot nickname with [REC] (both configurable).
  Audio stays on disk under the Hermes home and is never uploaded. First use downloads the
  chosen Whisper model from Hugging Face. Transcript text goes to your configured Hermes model.
  Posts notes to Discord, creates threads in project channels, DMs task assignees by default,
  writes approved owner tasks to the Hermes Kanban board and, only with LINEAR_API_KEY or an
  allowlisted linear MCP server, creates Linear issues. By default attaches the full transcript
  as a Markdown file to the Discord notes (delivery_discord_transcript). Optional, off by default:
  imports Google Meet transcripts with the user's own OAuth client and the read-only scope
  meetings.space.readonly (token stored 0600 in the plugin data dir; calls only
  meet.googleapis.com and oauth2.googleapis.com). Optional Obsidian export. Needs ffmpeg with
  libopus.
maintainer: propiter
tier: community
category: voice
requires_hermes: ">=0.21"
docs_url: https://github.com/propiter/hermes-meeting-scribe#readme
version: "0.2.0"
platforms:
- linux
- macos
capabilities:
  provides_tools:
  - meeting_search
  - meeting_get
  - meeting_task_list
  - meeting_task_assign
  - meeting_task_send
  provides_hooks: []
  provides_middleware: []
  requires_env: []
