[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-meeting-scribe"
version = "0.2.0"
description = "Hermes Agent plugin: record Discord meetings, transcribe locally, extract notes and tasks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pedro Rodriguez (propiter)" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
]

[project.optional-dependencies]
# discord.py and fastapi are provided by Hermes at runtime; dev installs them so the discord_ui and
# Desktop REST API tests run (httpx backs FastAPI's TestClient).
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "discord.py[voice]>=2.7,<3", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/propiter/hermes-meeting-scribe"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -m 'not slow'"
markers = [
    "slow: runs real faster-whisper (downloads a model); opt in with -m slow",
    "integration: needs a Hermes checkout importable (PYTHONPATH) and its venv",
]

[tool.ruff]
line-length = 110
target-version = "py311"
